services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: rag_qdrant
    ports:
      - '127.0.0.1:6333:6333' # HTTP / REST + Web UI
      - '127.0.0.1:6334:6334' # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:6333/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: rag_redis
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rag_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  rag_network:
    driver: bridge

volumes:
  qdrant_data:
  redis_data:
